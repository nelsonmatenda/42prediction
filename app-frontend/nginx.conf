server {
    listen 80;
    server_name matenda.me www.matenda.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name matenda.me www.matenda.me;

    ssl_certificate /etc/letsencrypt/live/matenda.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matenda.me/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass https://nelsonmatenda.github.io;
        proxy_set_header Host nelsonmatenda.github.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_ssl_server_name on;
        proxy_ssl_name nelsonmatenda.github.io;
    }

    location = /42prediction {
        return 301 https://$host/42prediction/;
    }

    location ^~ /42prediction/socket.io/ {
        proxy_pass http://127.0.0.1:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /42prediction/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /42prediction/index.html;
    }

    location /42prediction/api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}