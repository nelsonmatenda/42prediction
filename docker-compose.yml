name: 42 Prediction

services:
  # ---------------------------------------------------------------- App tier
  backend:
    build:
      context: ./app-backend
    container_name: transcendence-backend
    env_file: .env
    environment:
      NODE_ENV: production
      RUN_MIGRATIONS: "true"
      LOG_FILE: /app/logs/backend.log
      LOG_LEVEL: info
      SERVER_PORT: 3000
      FRONTEND_URL: https://localhost:5173
      GOOGLE_CALLBACK_URL: https://localhost:3000/auth/google/callback
      _42SCHOOL_CALLBACK_URL: https://localhost:3000/auth/42luanda/callback
    volumes:
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
      - ./certs:/certs:ro
    ports:
      - "3000:3000"
    networks: [transcendence]

  frontend:
    build:
      context: ./app-frontend
      args:
        VITE_API_URL: https://localhost:3000
    container_name: transcendence-frontend
    volumes:
      - ./certs:/certs:ro
    ports:
      - "5173:443"
      - "80:80"
    depends_on:
      - backend
    networks: [transcendence]


volumes:
  backend_logs:
  backend_uploads:


networks:
  transcendence:
    driver: bridge
